<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seek It — Moteur de Recherche</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #060607;
  color: #e8e8ec;
  font-family: 'Inter', -apple-system, sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
  -webkit-font-smoothing: antialiased;
}

body::before {
  content: '';
  position: fixed;
  top: -320px;
  left: 50%;
  transform: translateX(-50%);
  width: 150%;
  max-width: 1400px;
  height: 900px;
  background: radial-gradient(ellipse at center, rgba(255, 55, 55, 0.22) 0%, rgba(255, 30, 30, 0.08) 35%, transparent 65%);
  pointer-events: none;
  z-index: 0;
  filter: blur(40px);
}

.scene {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
  perspective: 1200px;
}

.grid-floor {
  position: absolute;
  bottom: -10%;
  left: 50%;
  width: 200%;
  height: 60%;
  transform: translateX(-50%) perspective(500px) rotateX(65deg);
  transform-origin: center bottom;
  background-image:
    linear-gradient(rgba(255, 60, 60, 0.18) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 60, 60, 0.18) 1px, transparent 1px);
  background-size: 60px 60px;
  mask-image: radial-gradient(ellipse at center bottom, black 20%, transparent 70%);
  -webkit-mask-image: radial-gradient(ellipse at center bottom, black 20%, transparent 70%);
  animation: gridScroll 12s linear infinite;
  opacity: 0.7;
}

@keyframes gridScroll {
  0% { background-position: 0 0; }
  100% { background-position: 0 60px; }
}

.ring {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 420px;
  height: 420px;
  margin: -210px 0 0 -210px;
  border-radius: 50%;
  border: 1px solid rgba(255, 80, 80, 0.18);
  transform-style: preserve-3d;
  animation: ringSpin 22s linear infinite;
}

.ring:nth-of-type(2) {
  width: 560px;
  height: 560px;
  margin: -280px 0 0 -280px;
  border-color: rgba(255, 80, 80, 0.10);
  animation-duration: 32s;
  animation-direction: reverse;
}

.ring:nth-of-type(3) {
  width: 700px;
  height: 700px;
  margin: -350px 0 0 -350px;
  border-color: rgba(255, 80, 80, 0.06);
  animation-duration: 48s;
}

@keyframes ringSpin {
  0% { transform: rotateX(72deg) rotateZ(0deg); }
  100% { transform: rotateX(72deg) rotateZ(360deg); }
}

/* === ÉTATS D'AFFICHAGE === */
.screen { display: none; position: relative; z-index: 2; }
.screen.active { display: flex; }

#loginScreen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  flex-direction: column;
}

#searchScreen, #adminScreen {
  flex-direction: column;
  min-height: 100vh;
  padding: 40px 24px;
}

.login-wrap {
  max-width: 420px;
  width: 100%;
  text-align: center;
}

.logo {
  width: 104px;
  height: 104px;
  border-radius: 24px;
  background: linear-gradient(160deg, #ffffff 0%, #cfcfd4 60%, #9a9aa2 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 40px;
  box-shadow:
    0 0 60px rgba(255, 60, 60, 0.35),
    0 0 0 1px rgba(255, 255, 255, 0.10) inset,
    0 30px 50px -20px rgba(0, 0, 0, 0.8);
}

.logo svg {
  width: 52px;
  height: 52px;
  color: #08080a;
}

h1 {
  font-family: 'Space Grotesk', 'Inter', sans-serif;
  font-size: clamp(2.2rem, 7vw, 3.2rem);
  font-weight: 700;
  letter-spacing: -0.045em;
  line-height: 1.08;
  color: #ffffff;
  margin-bottom: 22px;
}

h1 .accent {
  color: #ff5a5a;
}

.desc {
  font-size: 0.95rem;
  color: #8f8f99;
  line-height: 1.65;
  margin-bottom: 40px;
}

.form-group {
  margin-bottom: 20px;
  text-align: left;
}

.form-group label {
  display: block;
  font-size: 0.85rem;
  font-weight: 500;
  color: #c9c9d1;
  margin-bottom: 8px;
}

.form-group input {
  width: 100%;
  padding: 12px 16px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.12);
  color: #e8e8ec;
  font-size: 0.95rem;
  transition: all 0.3s;
}

.form-group input:focus {
  outline: none;
  background: rgba(255, 255, 255, 0.10);
  border-color: rgba(255, 80, 80, 0.4);
  box-shadow: 0 0 12px rgba(255, 60, 60, 0.15);
}

.btn {
  padding: 14px 32px;
  border-radius: 12px;
  border: none;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s;
  display: inline-flex;
  align-items: center;
  gap: 10px;
}

.btn-discord {
  width: 100%;
  background: linear-gradient(135deg, #5865f2 0%, #4752c4 100%);
  color: white;
  justify-content: center;
  margin-top: 20px;
}

.btn-discord:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(88, 101, 242, 0.3);
}

.btn-admin {
  background: rgba(255, 80, 80, 0.2);
  border: 1px solid rgba(255, 80, 80, 0.3);
  color: #ff8888;
}

.btn-admin:hover {
  background: rgba(255, 80, 80, 0.3);
  border-color: rgba(255, 80, 80, 0.5);
}

.btn-logout {
  background: rgba(100, 100, 110, 0.2);
  border: 1px solid rgba(100, 100, 110, 0.3);
  color: #a0a0aa;
}

.btn-logout:hover {
  background: rgba(100, 100, 110, 0.3);
}

.btn-secondary {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  color: #e8e8ec;
}

.btn-secondary:hover {
  background: rgba(255, 255, 255, 0.12);
}

/* === SEARCH INTERFACE === */
.search-container {
  max-width: 900px;
  margin: 0 auto 40px;
}

.search-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 30px;
  gap: 20px;
  flex-wrap: wrap;
}

.search-header h2 {
  font-size: 2rem;
  color: white;
}

.search-box {
  width: 100%;
  padding: 14px 20px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 12px;
  color: #e8e8ec;
  font-size: 1rem;
  margin-bottom: 16px;
  transition: all 0.3s;
}

.search-box:focus {
  outline: none;
  background: rgba(255, 255, 255, 0.10);
  border-color: rgba(255, 80, 80, 0.4);
  box-shadow: 0 0 12px rgba(255, 60, 60, 0.15);
}

.filters-toggle {
  background: rgba(255, 80, 80, 0.15);
  border: 1px solid rgba(255, 80, 80, 0.3);
  color: #ff8888;
  cursor: pointer;
  padding: 10px 16px;
  border-radius: 8px;
  font-size: 0.9rem;
}

.filters-toggle:hover {
  background: rgba(255, 80, 80, 0.25);
}

.filters-panel {
  display: none;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  padding: 20px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 12px;
  margin-bottom: 20px;
}

.filters-panel.open {
  display: grid;
}

.filter-field label {
  display: block;
  font-size: 0.8rem;
  font-weight: 600;
  color: #8f8f99;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 6px;
}

.filter-field input {
  width: 100%;
  padding: 8px 12px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 6px;
  color: #e8e8ec;
  font-size: 0.85rem;
}

/* === RÉSULTATS === */
.results-container {
  max-width: 900px;
  margin: 0 auto;
}

.result-card {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 16px;
  transition: all 0.3s;
}

.result-card:hover {
  background: rgba(255, 255, 255, 0.08);
  border-color: rgba(255, 80, 80, 0.3);
  box-shadow: 0 0 24px rgba(255, 60, 60, 0.1);
}

.result-card h3 {
  color: white;
  font-size: 1.1rem;
  margin-bottom: 12px;
}

.result-field {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  font-size: 0.9rem;
  border-bottom: 1px solid rgba(255, 255, 255, 0.04);
}

.result-field:last-child {
  border-bottom: none;
}

.result-label {
  color: #8f8f99;
  font-weight: 500;
}

.result-value {
  color: #e8e8ec;
  text-align: right;
}

.no-results {
  text-align: center;
  padding: 40px 20px;
  color: #8f8f99;
}

/* === ADMIN PANEL === */
.admin-container {
  max-width: 1000px;
  margin: 0 auto;
}

.admin-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 40px;
  flex-wrap: wrap;
  gap: 20px;
}

.admin-section {
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 12px;
  padding: 24px;
  margin-bottom: 24px;
}

.admin-section h3 {
  color: #ff8888;
  margin-bottom: 16px;
  font-size: 1.1rem;
}

.form-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin-bottom: 16px;
}

.form-row .form-group {
  margin-bottom: 0;
}

.table-wrapper {
  overflow-x: auto;
  margin-bottom: 16px;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.9rem;
}

table th {
  background: rgba(255, 80, 80, 0.1);
  color: #ff8888;
  padding: 12px;
  text-align: left;
  font-weight: 600;
  border-bottom: 1px solid rgba(255, 80, 80, 0.2);
}

table td {
  padding: 12px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.04);
  color: #e8e8ec;
}

table tr:hover {
  background: rgba(255, 255, 255, 0.03);
}

.btn-delete {
  background: rgba(255, 60, 60, 0.2);
  border: none;
  color: #ff8888;
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.8rem;
  transition: all 0.3s;
}

.btn-delete:hover {
  background: rgba(255, 60, 60, 0.35);
}

.success-msg {
  background: rgba(76, 175, 80, 0.15);
  border: 1px solid rgba(76, 175, 80, 0.3);
  color: #90ee90;
  padding: 12px 16px;
  border-radius: 8px;
  margin-bottom: 16px;
  display: none;
}

.success-msg.show {
  display: block;
}

/* === RESPONSIVE === */
@media (max-width: 768px) {
  #searchScreen, #adminScreen {
    padding: 24px 16px;
  }

  .search-header {
    flex-direction: column;
    align-items: stretch;
  }

  .filters-panel {
    grid-template-columns: 1fr;
  }

  .result-field {
    flex-direction: column;
  }

  .result-value {
    text-align: left;
    margin-top: 4px;
  }
}
</style>
</head>
<body>

<div class="scene" aria-hidden="true">
  <div class="grid-floor"></div>
  <div class="ring"></div>
  <div class="ring"></div>
  <div class="ring"></div>
</div>

<!-- === LOGIN SCREEN === -->
<div id="loginScreen" class="screen active">
  <div class="login-wrap">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
    </div>
    <h1>Seek <span class="accent">It</span></h1>
    <p class="desc">Moteur de recherche de personnes avec données publiques</p>
    
    <div class="form-group">
      <label>Nom d'utilisateur Discord</label>
      <input type="text" id="discordUsername" placeholder="ton_pseudo">
    </div>

    <button class="btn btn-discord" onclick="login()">
      <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
        <path d="M20.317 4.369a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037 13.79 13.79 0 0 0-.617 1.27 18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.626-1.27.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.331c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
      </svg>
      Se connecter
    </button>
  </div>
</div>

<!-- === SEARCH SCREEN === -->
<div id="searchScreen" class="screen">
  <div class="search-container">
    <div class="search-header">
      <h2>Rechercher</h2>
      <div style="display: flex; gap: 10px;">
        <button class="btn btn-admin" onclick="goToAdmin()">Panneau Admin</button>
        <button class="btn btn-logout" onclick="logout()">Déconnexion</button>
      </div>
    </div>

    <input type="text" class="search-box" id="mainSearch" placeholder="Prénom + Nom / Email / Numéro...">
    
    <button class="filters-toggle" onclick="toggleFilters()">+ Filtres avancés</button>

    <div class="filters-panel" id="filtersPanel">
      <div class="filter-field">
        <label>Pays</label>
        <input type="text" id="filterPays" placeholder="France">
      </div>
      <div class="filter-field">
        <label>Ville</label>
        <input type="text" id="filterVille" placeholder="Paris">
      </div>
      <div class="filter-field">
        <label>Code Postal</label>
        <input type="text" id="filterCodePostal" placeholder="75001">
      </div>
      <div class="filter-field">
        <label>Département</label>
        <input type="text" id="filterDept" placeholder="75">
      </div>
      <div class="filter-field">
        <label>Adresse</label>
        <input type="text" id="filterAdresse">
      </div>
      <div class="filter-field">
        <label>Adresse IP</label>
        <input type="text" id="filterIP" placeholder="192.168.1.1">
      </div>
      <div class="filter-field">
        <label>IBAN</label>
        <input type="text" id="filterIBAN">
      </div>
      <div class="filter-field">
        <label>Année Naissance</label>
        <input type="text" id="filterAnnee" placeholder="1990">
      </div>
      <div class="filter-field">
        <label>Genre</label>
        <input type="text" id="filterGenre" placeholder="M/F">
      </div>

        <label>Fiabilité Min</label>
        <input type="number" id="filterFiabilite" placeholder="80" min="0" max="100">
      </div>

    <button class="btn btn-secondary" onclick="search()" style="width: 100%; margin-bottom: 40px;">Rechercher</button>
  </div>

  <div class="results-container" id="resultsContainer"></div>
</div>

<!-- === ADMIN SCREEN === -->
<div id="adminScreen" class="screen">
  <div class="admin-container">
    <div class="admin-header">
      <h2 style="color: white; font-size: 2rem;">Panneau Admin</h2>
      <div style="display: flex; gap: 10px;">
        <button class="btn btn-logout" onclick="backToSearch()">Retour à la Recherche</button>
        <button class="btn btn-logout" onclick="logout()">Déconnexion</button>
      </div>
    </div>

    <div class="success-msg" id="successMsg">Opération effectuée avec succès!</div>

    <!-- Ajouter un enregistrement -->
    <div class="admin-section">
      <h3>➕ Ajouter un Enregistrement</h3>
      <div class="form-row">
        <div class="form-group" style="margin-bottom: 0;">
          <label>Prénom</label>
          <input type="text" id="adminPrenom" placeholder="Jean">
        </div>
        <div class="form-group" style="margin-bottom: 0;">
          <label>Nom</label>
          <input type="text" id="adminNom" placeholder="Dupont">

      <div class="form-row">
        <div class="form-group" style="margin-bottom: 0;">
          <label>Email</label>
          <input type="email" id="adminEmail" placeholder="email@example.com">
        </div>
        <div class="form-group" style="margin-bottom: 0;">
          <label>Téléphone</label>
          <input type="tel" id="adminTel" placeholder="0612345678">
        </div>

      <div class="form-row">
        <div class="form-group" style="margin-bottom: 0;">
          <label>Ville</label>
          <input type="text" id="adminVille" placeholder="Paris">
        </div>
        <div class="form-group" style="margin-bottom: 0;">
          <label>Pays</label>
          <input type="text" id="adminPays" placeholder="France">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group" style="margin-bottom: 0;">
          <label>Code Postal</label>
          <input type="text" id="adminCP" placeholder="75001">
        </div>
        <div class="form-group" style="margin-bottom: 0;">
          <label>Année Naissance</label>
          <input type="number" id="adminAnnee" placeholder="1990">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group" style="margin-bottom: 0;">
          <label>Adresse IP</label>
          <input type="text" id="adminIP" placeholder="192.168.1.1">
        </div>
        <div class="form-group" style="margin-bottom: 0;">
          <label>Fiabilité (%)</label>
          <input type="number" id="adminFiabilite" placeholder="95" min="0" max="100">

      </div>
      <button class="btn btn-discord" onclick="addRecord()" style="width: 100%; margin-top: 12px;">Ajouter</button>

    <!-- Gestion de la base de données -->
    <div class="admin-section">
      <h3>🗄️ Gestion Base de Données</h3>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Prénom</th>
              <th>Nom</th>
              <th>Email</th>
              <th>Téléphone</th>
              <th>Ville</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="adminTable">
            <tr><td colspan="6" style="text-align: center; color: #8f8f99;">Aucune donnée</td></tr>
          </tbody>
        </table>
      </div>
      <button class="btn btn-secondary" onclick="exportDatabase()" style="margin-right: 10px;">📥 Exporter</button>
      <button class="btn btn-secondary" onclick="clearDatabase()">🗑️ Vider la Base</button>
    </div>
  </div>
</div>

<script>
// === STATE MANAGEMENT ===
let currentUser = null;
let database = [];

// Load from localStorage on startup
function initDatabase() {
  const saved = localStorage.getItem('seekitDB');
  if (saved) {
    try {
      database = JSON.parse(saved);
    } catch(e) {
      database = [];
    }
  }
}

function saveDatabase() {
  localStorage.setItem('seekitDB', JSON.stringify(database));
}

function showScreen(screenId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(screenId).classList.add('active');
}

// === LOGIN ===
function login() {
  const username = document.getElementById('discordUsername').value.trim();
  if (!username) {
    alert('Entre ton pseudo Discord');
    return;
  }
  currentUser = {
    username: username,
    isAdmin: username === 'gouvernemental.'
  };
  initDatabase();
  showScreen('searchScreen');
}

function logout() {
  currentUser = null;
  document.getElementById('discordUsername').value = '';
  document.getElementById('mainSearch').value = '';
  document.getElementById('resultsContainer').innerHTML = '';
  clearAllFilters();
  showScreen('loginScreen');
}

// === SEARCH INTERFACE ===
function toggleFilters() {
  document.getElementById('filtersPanel').classList.toggle('open');
}

function clearAllFilters() {
  document.querySelectorAll('[id^="filter"]').forEach(el => el.value = '');
}

function search() {
  const query = document.getElementById('mainSearch').value.toLowerCase();
  
  if (!query) {
    document.getElementById('resultsContainer').innerHTML = '<div class="no-results">Entre un terme de recherche</div>';
    return;
  }

  // Get filters
  const filters = {
    pays: document.getElementById('filterPays').value.toLowerCase(),
    ville: document.getElementById('filterVille').value.toLowerCase(),
    codePostal: document.getElementById('filterCodePostal').value.toLowerCase(),
    dept: document.getElementById('filterDept').value.toLowerCase(),
    adresse: document.getElementById('filterAdresse').value.toLowerCase(),
    ip: document.getElementById('filterIP').value.toLowerCase(),
    iban: document.getElementById('filterIBAN').value.toLowerCase(),
    annee: document.getElementById('filterAnnee').value.toLowerCase(),
    genre: document.getElementById('filterGenre').value.toLowerCase(),
    fiabilite: parseInt(document.getElementById('filterFiabilite').value) || 0
  };

  // Search & filter
  let results = database.filter(record => {
    const matchesQuery =
      record.prenom.toLowerCase().includes(query) ||
      record.nom.toLowerCase().includes(query) ||
      record.email.toLowerCase().includes(query) ||
      record.telephone.includes(query);

    if (!matchesQuery) return false;

    // Apply filters
    if (filters.pays && !record.pays.toLowerCase().includes(filters.pays)) return false;
    if (filters.ville && !record.ville.toLowerCase().includes(filters.ville)) return false;
    if (filters.codePostal && !record.codePostal.includes(filters.codePostal)) return false;
    if (filters.dept && !record.codePostal.startsWith(filters.dept)) return false;
    if (filters.adresse && !record.adresse.toLowerCase().includes(filters.adresse)) return false;
    if (filters.ip && !record.ip.includes(filters.ip)) return false;
    if (filters.iban && !record.iban.toLowerCase().includes(filters.iban)) return false;
    if (filters.annee && !record.annee.toString().includes(filters.annee)) return false;
    if (filters.genre && !record.genre.toLowerCase().includes(filters.genre)) return false;
    if (filters.fiabilite && record.fiabilite < filters.fiabilite) return false;

    return true;
  });

  // Display results
  const container = document.getElementById('resultsContainer');
  if (results.length === 0) {
    container.innerHTML = '<div class="no-results">Aucun résultat trouvé</div>';
    return;
  }

  container.innerHTML = results.map(r => `
    <div class="result-card">
      <h3>${r.prenom} ${r.nom}</h3>
      <div class="result-field">
        <span class="result-label">Email</span>
        <span class="result-value">${r.email}</span>
      </div>
      <div class="result-field">
        <span class="result-label">Téléphone</span>
        <span class="result-value">${r.telephone}</span>
      </div>
      <div class="result-field">
        <span class="result-label">Localisation</span>
        <span class="result-value">${r.ville}, ${r.codePostal} - ${r.pays}</span>
      </div>
      <div class="result-field">
        <span class="result-label">Adresse IP</span>
        <span class="result-value">${r.ip}</span>
      </div>
      <div class="result-field">
        <span class="result-label">Année Naissance</span>
        <span class="result-value">${r.annee}</span>
      </div>
      <div class="result-field">
        <span class="result-label">Fiabilité</span>
        <span class="result-value">${r.fiabilite}%</span>
      </div>
    </div>
  `).join('');
}

// === ADMIN PANEL ===
function goToAdmin() {
  if (!currentUser.isAdmin) {
    alert('Accès réservé aux admins');
    return;
  }
  refreshAdminTable();
  showScreen('adminScreen');
}

function backToSearch() {
  showScreen('searchScreen');
}

function addRecord() {
  if (!currentUser.isAdmin) return;

  const record = {
    prenom: document.getElementById('adminPrenom').value,
    nom: document.getElementById('adminNom').value,
    email: document.getElementById('adminEmail').value,
    telephone: document.getElementById('adminTel').value,
    ville: document.getElementById('adminVille').value,
    pays: document.getElementById('adminPays').value,
    codePostal: document.getElementById('adminCP').value,
    adresse: document.getElementById('adminAdresse')?.value || '',
    ip: document.getElementById('adminIP').value,
    iban: document.getElementById('adminIBAN')?.value || '',
    annee: parseInt(document.getElementById('adminAnnee').value) || 0,
    genre: document.getElementById('adminGenre')?.value || '',
    fiabilite: parseInt(document.getElementById('adminFiabilite').value) || 90
  };

  if (!record.prenom || !record.nom || !record.email) {
    alert('Remplis au minimum: Prénom, Nom, Email');
    return;
  }

  database.push(record);
  saveDatabase();
  
  // Clear form
  document.getElementById('adminPrenom').value = '';
  document.getElementById('adminNom').value = '';
  document.getElementById('adminEmail').value = '';
  document.getElementById('adminTel').value = '';
  document.getElementById('adminVille').value = '';
  document.getElementById('adminPays').value = '';
  document.getElementById('adminCP').value = '';
  document.getElementById('adminIP').value = '';
  document.getElementById('adminAnnee').value = '';
  document.getElementById('adminFiabilite').value = '';

  showSuccess();
  refreshAdminTable();
}

function deleteRecord(index) {
  if (!currentUser.isAdmin || !confirm('Confirmer la suppression?')) return;
  database.splice(index, 1);
  saveDatabase();
  showSuccess();
  refreshAdminTable();
}

function refreshAdminTable() {
  const tbody = document.getElementById('adminTable');
  if (database.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #8f8f99;">Aucune donnée</td></tr>';
    return;
  }

  tbody.innerHTML = database.map((r, i) => `
    <tr>
      <td>${r.prenom}</td>
      <td>${r.nom}</td>
      <td>${r.email}</td>
      <td>${r.telephone}</td>
      <td>${r.ville}</td>
      <td><button class="btn-delete" onclick="deleteRecord(${i})">Supprimer</button></td>
    </tr>
  `).join('');
}

function exportDatabase() {
  const json = JSON.stringify(database, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `seekit-backup-${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showSuccess();
}

function clearDatabase() {
  if (!confirm('Vider TOUTE la base? (irréversible)')) return;
  database = [];
  saveDatabase();
  showSuccess();
  refreshAdminTable();
}

function showSuccess() {
  const msg = document.getElementById('successMsg');
  msg.classList.add('show');
  setTimeout(() => msg.classList.remove('show'), 2000);
}

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && document.getElementById('searchScreen').classList.contains('active')) {
    search();
  }
});

// Initialize on load
window.addEventListener('load', initDatabase);
</script>
